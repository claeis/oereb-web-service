language: java

jdk:
  - openjdk11

  
addons:
  postgresql: 12
  apt:
    packages:
    - postgresql-postgis
  ssh_known_hosts:
  - ftp.umleditor.org

branches:
  only:
    - master
    - stable

env:
  global:
  - PGPORT=5433
  - PGUSER=postgres

install: true

before_script:
    - # show port used by different installed versions
    - grep port /etc/postgresql/*/main/postgresql.conf
    - # enable same access rules in new installed version 12 as in pre-installed version 13
    - sudo cp /etc/postgresql/13/main/pg_hba.conf /etc/postgresql/12/main/pg_hba.conf
    - # restart postgresql because of changes to pg_hba.conf
    - sudo service postgresql stop
    - sudo service postgresql start 12
    - psql -c 'create database ili2db;' -U $PGUSER
    - psql -c 'select version();' -d ili2db -U $PGUSER
    - psql -c 'create extension postgis;' -d ili2db -U $PGUSER
    - psql -c 'create extension "uuid-ossp";' -d ili2db -U $PGUSER
    - psql -c 'select postgis_full_version();' -d ili2db -U $PGUSER

script: 
  - export TZ="Europe/Zurich"; ./gradlew -Dspring_config_location=file:travis/ asciidoctor build
  - # ssh-keyscan -H ftp.umleditor.org >> ~/.ssh/known_hosts;./gradlew -Drepos_url=${repos_url} -Drepos_pwd=${repos_pwd} -Drepos_usr=${repos_usr} uploadTests
deploy:
  - provider: script
    skip_cleanup: true
    script: "./gradlew -Dspring_config_location=file:travis/ -Drepos_url=${repos_url} -Drepos_pwd=${repos_pwd} -Drepos_usr=${repos_usr} publish; body='{\"request\": {\"branch\":\"master\"}}'; curl -s -X POST -H \"Content-Type: application/json\" -H \"Accept: application/json\" -H \"Travis-API-Version: 3\" -H \"Authorization: token $travis_token\" -d \"$body\" https://api.travis-ci.org/repo/sogis%2Foereb-web-service-docker/requests"
    on:
      branch: master
  - provider: script
    skip_cleanup: true
    script: ./gradlew -Dspring_config_location=file:travis/ -Drepos_url=${repos_url} -Drepos_pwd=${repos_pwd} -Drepos_usr=${repos_usr} '-Drelease=' publish
    on:
      branch: stable
